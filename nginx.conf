server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve .html files without the extension in the URL
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # CSS/JS/fonts: immutable since Dockerfile injects content-hash query strings
    location ~* \.(css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images/media: must-revalidate so updated assets are picked up on next load
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|webm)$ {
        expires 1y;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
