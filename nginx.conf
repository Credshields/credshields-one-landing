server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve .html files without the extension in the URL
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # HTML: never cache — must always fetch fresh so updated asset hashes are picked up
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Hashed build assets (Vite emits to /assets/*): cache forever, immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Other static files (fonts, public/ passthrough, etc.) — safe long cache + revalidate
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|webm|woff2?|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
