# GENERATED by prod-ops/bin/codeowners_sync.py from prod-ops/codeowners/owners.yml. Do not edit here: change the map
# in prod-ops and re-run the sync (runbook: prod-ops/handoffs/runbook-codeowners.md).
# GitHub Free has no CODEOWNERS enforcement on private repos. This job requests the code owners of the changed files as
# reviewers and sets the NON-BLOCKING commit status "code-owner-review" (pending until an owner approves the head).
name: code-owner-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: code-owner-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  code-owners:
    # Fork PRs get a read-only token; the org works from same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request code owners and set the code-owner-review status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/codeowners_review.py" <<'CODEOWNERS_REVIEW_PY'
          #!/usr/bin/env python3
          """Code-owner reviews for private repos on GitHub Free (no native CODEOWNERS enforcement there).

          Runs inside the generated .github/workflows/codeowners-review.yml on pull_request / pull_request_review events:
            1. reads the repo's CODEOWNERS (base branch, else the default branch; the PR head only for the sync's rollout PR);
            2. maps the changed files to owners (gitignore-style patterns, last matching rule wins, like GitHub);
            3. requests the matching owners as reviewers (never the PR author; drafts are skipped until ready);
            4. sets the non-blocking commit status "code-owner-review": pending until, for every owned group of changed files,
               an owner other than the author approves the PR's latest head commit, then success. Nothing blocks a merge on GitHub Free; the status is visibility only.

          Source of truth: prod-ops/codeowners/owners.yml -> bin/codeowners_sync.py renders this file into each repo's workflow.
          Stdlib only. Needs GITHUB_TOKEN with pull-requests: write and statuses: write.
          """
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          STATUS_CONTEXT = "code-owner-review"
          SYNC_BRANCH = "chore/codeowners-sync"  # rollout PRs: the only PRs allowed to take CODEOWNERS from their own head
          CODEOWNERS_PATHS = (".github/CODEOWNERS", "CODEOWNERS", "docs/CODEOWNERS")
          DECISIVE = ("APPROVED", "CHANGES_REQUESTED", "DISMISSED")
          LOGIN_RE = re.compile(r"^@([A-Za-z0-9](?:[A-Za-z0-9-]{0,38}))$")


          def compile_pattern(pattern):
              """Translate one CODEOWNERS pattern (gitignore syntax, GitHub flavour) to a regex over repo-relative file paths."""
              p = pattern
              if p.startswith("\\#"):
                  p = p[1:]
              dir_only = p.endswith("/") and p != "/"
              p = p.rstrip("/") if p != "/" else ""
              anchored = p.startswith("/") or "/" in p
              p = p.lstrip("/")
              direct_children = p.endswith("/*") and not p.endswith("/**/*")
              out, i = "", 0
              while i < len(p):
                  if p.startswith("**/", i):
                      out += "(?:.*/)?"
                      i += 3
                  elif p.startswith("**", i):
                      out += ".*"
                      i += 2
                  elif p[i] == "*":
                      out += "[^/]*"
                      i += 1
                  elif p[i] == "?":
                      out += "[^/]"
                      i += 1
                  else:
                      out += re.escape(p[i])
                      i += 1
              if not p:  # "/" alone: the whole repo
                  return re.compile(r"^.*$")
              prefix = "^" if anchored else "^(?:.*/)?"
              if direct_children:
                  suffix = "$"
              elif dir_only:
                  suffix = "/.*$"
              else:
                  suffix = "(?:/.*)?$"
              return re.compile(prefix + out + suffix)


          def parse(text):
              """Return [(pattern, regex, [logins])]. Teams and e-mail owners are ignored (the generator only emits users)."""
              rules = []
              for raw in (text or "").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  owners = []
                  for tok in parts[1:]:
                      if tok.startswith("#"):
                          break
                      m = LOGIN_RE.match(tok)
                      if m:
                          owners.append(m.group(1))
                  rules.append((parts[0], compile_pattern(parts[0]), owners))
              return rules


          def owners_for(rules, path):
              found = []
              for _pat, rx, owners in rules:
                  if rx.match(path):
                      found = owners
              return found


          def owner_sets(rules, paths):
              """Distinct owner sets of the changed files (files without owners are left out). Each set needs its own approval."""
              seen, out = set(), []
              for path in paths:
                  owners = owners_for(rules, path)
                  key = frozenset(o.lower() for o in owners)
                  if owners and key not in seen:
                      seen.add(key)
                      out.append(owners)
              return out


          def union(sets):
              seen, out = set(), []
              for owners in sets:
                  for o in owners:
                      if o.lower() not in seen:
                          seen.add(o.lower())
                          out.append(o)
              return out


          def latest_decisive(reviews):
              """login(lower) -> (state, commit_id, login) of each reviewer's latest approve / request-changes / dismissal."""
              latest = {}
              for r in reviews or []:
                  state = r.get("state")
                  login = ((r.get("user") or {}).get("login")) or ""
                  if state in DECISIVE and login:
                      latest[login.lower()] = (state, r.get("commit_id"), login)
              return latest


          def _who(logins):
              return " or ".join("@" + x for x in logins)


          def evaluate(sets, author, reviews, head_sha):
              """Return (state, description) for the code-owner-review status.

              Like GitHub's "require review from code owners": every distinct owner set among the changed files needs an approval
              of the head commit from one of its owners other than the author.
              """
              if not sets:
                  return "success", "No code owners for the changed files"
              latest = latest_decisive(reviews)
              approvers, waiting = [], []
              for owners in sets:
                  eligible = [o for o in owners if o.lower() != (author or "").lower()]
                  if not eligible:
                      return "pending", "Only the author owns some changed files; add a backup owner in owners.yml"
                  ok = [latest[o.lower()][2] for o in eligible
                        if latest.get(o.lower(), ("",))[0] == "APPROVED" and latest[o.lower()][1] == head_sha]
                  if ok:
                      approvers += [x for x in ok if x not in approvers]
                  else:
                      waiting.append(eligible)
              if not waiting:
                  return "success", ("Approved by " + ", ".join("@" + x for x in approvers))[:140]
              eligible = waiting[0]
              changes = [latest[o.lower()][2] for o in eligible if latest.get(o.lower(), ("",))[0] == "CHANGES_REQUESTED"]
              if changes:
                  return "pending", ("Changes requested by " + ", ".join("@" + x for x in changes))[:140]
              stale = [latest[o.lower()][2] for o in eligible if latest.get(o.lower(), ("",))[0] == "APPROVED"]
              if stale:
                  return "pending", ("Approved an older commit: " + ", ".join("@" + x for x in stale) + "; re-review the head")[:140]
              return "pending", ("Waiting for a code-owner review from " + _who(eligible))[:140]


          def to_request(owners, author, pr, reviews, head_sha=None):
              """Owners still to ask: not the author, not already requested, not already reviewed, except that an owner whose
              latest verdict is an approval of an older commit is asked again (new commits need a fresh look)."""
              skip = {(author or "").lower()}
              skip |= {(u.get("login") or "").lower() for u in pr.get("requested_reviewers") or []}
              latest = latest_decisive(reviews)
              for r in reviews or []:
                  login = ((r.get("user") or {}).get("login") or "").lower()
                  verdict = latest.get(login)
                  if not (verdict and verdict[0] == "APPROVED" and verdict[1] != head_sha):
                      skip.add(login)
              return [o for o in owners if o.lower() not in skip]


          class GitHub:  # pragma: no cover - network
              def __init__(self, token, api="https://api.github.com"):
                  self.token, self.api = token, api.rstrip("/")

              def request(self, method, path, body=None):
                  url = path if path.startswith("http") else self.api + path
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(url, data=data, method=method, headers={
                      "Authorization": "Bearer " + self.token, "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "codeowners-review"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else None, resp.headers.get("Link") or ""

              def get(self, path):
                  return self.request("GET", path)[0]

              def paged(self, path):
                  out, url = [], path + ("&" if "?" in path else "?") + "per_page=100"
                  while url:
                      page, link = self.request("GET", url)
                      out.extend(page or [])
                      m = re.search(r'<([^>]+)>;\s*rel="next"', link)
                      url = m.group(1) if m else None
                  return out

              def post(self, path, body):
                  return self.request("POST", path, body)[0]


          def fetch_codeowners(gh, repo, refs):  # pragma: no cover - network
              import base64
              for ref in refs:
                  if not ref:
                      continue
                  for path in CODEOWNERS_PATHS:
                      try:
                          doc = gh.get("/repos/%s/contents/%s?ref=%s" % (repo, path, urllib.parse.quote(ref, safe="")))
                      except urllib.error.HTTPError as e:
                          if e.code == 404:
                              continue
                          raise
                      return base64.b64decode(doc["content"]).decode(), "%s@%s" % (path, ref)
              return "", None


          def request_reviewers(gh, repo, number, logins):  # pragma: no cover - network
              path = "/repos/%s/pulls/%s/requested_reviewers" % (repo, number)
              try:
                  gh.post(path, {"reviewers": logins})
                  return list(logins), []
              except urllib.error.HTTPError:
                  ok, bad = [], []
                  for login in logins:  # one owner without repo access must not block the others
                      try:
                          gh.post(path, {"reviewers": [login]})
                          ok.append(login)
                      except urllib.error.HTTPError as e:
                          bad.append("%s (%s)" % (login, e.code))
                  return ok, bad


          def main():  # pragma: no cover - orchestration (covered live by the prod-ops pilot)
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
              repo = os.environ["GITHUB_REPOSITORY"]
              gh = GitHub(os.environ["GITHUB_TOKEN"], os.environ.get("GITHUB_API_URL", "https://api.github.com"))
              pr = gh.get("/repos/%s/pulls/%s" % (repo, event["pull_request"]["number"]))  # fresh: head sha, draft, requests
              number, head, author = pr["number"], pr["head"]["sha"], pr["user"]["login"]
              refs = [pr["base"]["ref"], (event.get("repository") or {}).get("default_branch")]
              if pr["head"]["ref"] == SYNC_BRANCH:  # otherwise a PR author could name the owners of their own PR
                  refs.append(head)
              text, source = fetch_codeowners(gh, repo, refs)
              rules = parse(text)
              files = [f["filename"] for f in gh.paged("/repos/%s/pulls/%s/files" % (repo, number))]
              sets = owner_sets(rules, files)
              owners = union(sets)
              reviews = gh.paged("/repos/%s/pulls/%s/reviews" % (repo, number))
              print("CODEOWNERS: %s; %d changed file(s); owners: %s; author: %s" % (source, len(files), owners or "none", author))
              if event_name == "pull_request" and not pr.get("draft"):
                  ask = to_request(owners, author, pr, reviews, head)
                  if ask:
                      ok, bad = request_reviewers(gh, repo, number, ask)
                      print("requested: %s" % (ok or "none"))
                      for b in bad:
                          print("::warning::could not request %s: give them read access to the repo" % b)
              state, desc = evaluate(sets, author, reviews, head)
              run_url = "%s/%s/actions/runs/%s" % (os.environ.get("GITHUB_SERVER_URL", "https://github.com"), repo, os.environ.get("GITHUB_RUN_ID", ""))
              gh.post("/repos/%s/statuses/%s" % (repo, head), {"state": state, "context": STATUS_CONTEXT, "description": desc, "target_url": run_url})
              print("status %s: %s (%s)" % (STATUS_CONTEXT, state, desc))
              return 0


          if __name__ == "__main__":  # pragma: no cover
              sys.exit(main())
          CODEOWNERS_REVIEW_PY
          python3 "$RUNNER_TEMP/codeowners_review.py"
